<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Nezine — Linux terminal</title>
  <desc id="desc">A terminal showing Nezine's interests in C, Linux, and systems programming, and the goal of contributing to the Linux kernel.</desc>
  <rect x="1" y="1" width="1198" height="378" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M15 2h1170a13 13 0 0 1 13 13v39H2V15A13 13 0 0 1 15 2Z" fill="#161b22"/>
  <path d="M2 54h1196" stroke="#30363d"/>
  <g font-family="DejaVu Sans Mono, monospace">
    <text x="28" y="34" fill="#8b949e" font-size="16">~/about</text>
    <text x="600" y="34" text-anchor="middle" fill="#c9d1d9" font-size="16">nezine@linux: ~</text>
    <g stroke="#8b949e" stroke-width="1.5" fill="none">
      <path d="M1081 31h12"/><rect x="1120" y="22" width="11" height="11"/><path d="m1160 22 11 11m0-11-11 11"/>
    </g>
    <text x="38" y="105" font-size="23"><tspan fill="#7ee787">nezine@linux</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#c9d1d9">$ whoami</tspan></text>
    <text x="38" y="164" fill="#f0f6fc" font-size="43" font-weight="bold">Nezine</text>
    <text x="38" y="214" font-size="23"><tspan fill="#7ee787">nezine@linux</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#c9d1d9">$ cat direction.txt</tspan></text>
    <text x="38" y="254" fill="#c9d1d9" font-size="22">C / Linux / systems programming</text>
    <text x="38" y="291" fill="#a5d6ff" font-size="22">Long-term goal: contribute to the Linux kernel.</text>
    <text x="38" y="345" font-size="23"><tspan fill="#7ee787">nezine@linux</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#c9d1d9">$</tspan></text>
    <rect x="246" y="325" width="13" height="25" fill="#7ee787"/>
